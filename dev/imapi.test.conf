# Local development only. Production: use the hosting provider's trusted certificate.
<VirtualHost *:80>
    ServerName imapi.test
    DocumentRoot /home/claude/projekte/imapi/public
    <Directory /home/claude/projekte/imapi/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.php
        CGIPassAuth On
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/imapi.test-error.log
    CustomLog ${APACHE_LOG_DIR}/imapi.test-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName imapi.test
    DocumentRoot /home/claude/projekte/imapi/public
    SSLEngine on
    SSLCertificateFile /home/claude/projekte/imapi/.dev/imapi.test.crt
    SSLCertificateKeyFile /home/claude/projekte/imapi/.dev/imapi.test.key
    <Directory /home/claude/projekte/imapi/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.php
        CGIPassAuth On
        php_admin_flag display_errors Off
        php_admin_value zend.exception_ignore_args On
    </Directory>
    LimitRequestBody 20971520
    ErrorLog ${APACHE_LOG_DIR}/imapi.test-error.log
    CustomLog ${APACHE_LOG_DIR}/imapi.test-access.log combined
</VirtualHost>
